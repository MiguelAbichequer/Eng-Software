<!DOCTYPE html> <!--serve para informar ao navegador que o documento está usando HTML5-->

<!--indica que começa o doc HTML e informa que o idioma da página é português do Brasil-->
<html lang="pt-br"> 

    <head> <!--área de configurações e informações-->
        
        <!--diz ao navegador como os caracteres devem ser interpretados-->
        <!--meta fornece informações sobre a página para o navegador-->
        <!--charset significa conjunto de caracteres-->
        <meta charset="UTF-8"> 

        <title>Cadastro de Aluno</title> <!--título da página, o que aparece na aba do navegador-->

    </head>

    <body>

        <h1>Cadastro do Aluno</h1> <!--h1 é o tamanho do título, vai até o h6 que é o menor-->

        <!-- form é uma área em que o usuário digita as informações e depois enviar esses dados-->
        <!--Indica que o formulário enviará os dados para o servidor utilizando uma requisição POST-->
        <form method="post">

            {%csrf_token%}

            <label for="matricula">Matrícula:</label> <!--título do campo de escrita-->
            <input type="text" id="matricula" name="matricula" required>

            <br><br> <!--break line-->

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <br><br>

            <label for="senha">Senha:</label> 
            <input type="password" id="senha" name="senha" required> 
            
            <br><br>

            <button type="submit">Cadastrar</button>

        </form>

    </body>
</html>
