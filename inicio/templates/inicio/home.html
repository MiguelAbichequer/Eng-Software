{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Sistema de Monitoria</title>

<link rel="stylesheet" href="{% static 'css/inicio/button.css' %}">
</head>

<body>

    <h1>Agendamento de Monitoria &#128197</h1>

    <p>Entrar no Sistema</p>

    <div class="text-box">
        <form method="post">
            {% csrf_token %}
            {% if erro %}
                <p>{{ erro }}</p>
             {% endif %}

            {% if mensagem %}
                <p>{{ mensagem }}</p>
            {% endif %}

            <label>Entrar como:</label>
            <label><input type="radio" name="tipo" value="aluno" {% if tipo != 'monitor' %}checked{% endif %}> Aluno</label>
            <label><input type="radio" name="tipo" value="monitor" {% if tipo == 'monitor' %}checked{% endif %}> Monitor</label>
            <br><br>
            <label for="username">Matrícula:</label>
            <input type="text" id="username" name="username" required>
            <br><br>
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>
            <br><br>
            <button type="submit">Entrar</button>
        </form>
    </div>

    <p>Ou cadastrar novo usuário:</p>
    <div class ="text-box">
        <a class="btn btn-white" href="/alunos/cadastro/">Aluno</a>
        <a class="btn btn-white" href="/monitor/cadastro/">Monitor</a>
    </div>

</body>

</html>
